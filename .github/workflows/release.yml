name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    # Manual publishes only from main. Tag pushes publish that tag.
    # This workflow cannot `needs` the CI job: that job lives in another file.
    # Tag pushes do not run ci.yml, so the publish job repeats those gates.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: fusedashlabs/ui9000-widgets
          path: vendor/ui9000-widgets
          token: ${{ secrets.WIDGETS_CHECKOUT_TOKEN }}
          ref: v0.7.3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: corepack prepare yarn@4.5.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: yarn
      - run: yarn install --immutable
      - run: node scripts/secret-scan.mjs
      - run: yarn npm audit --severity high --environment production
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: node scripts/assert-pack.mjs
      - name: Publish @fusedashlabs/ui9000-workspace
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
